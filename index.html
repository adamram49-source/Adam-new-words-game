    <script>
        const originalVocab = [

        ];

        const irregularVerbs = [
            { v1: "speak", v2: "spoke", he: "לדבר" }, { v1: "break", v2: "broke", he: "לשבור" },
            { v1: "steal", v2: "stole", he: "לגנוב" }, { v1: "write", v2: "wrote", he: "לכתוב" },
            { v1: "ride", v2: "rode", he: "לרכוב" }, { v1: "choose", v2: "chose", he: "לבחור" },
            { v1: "drive", v2: "drove", he: "לנהוג" }, { v1: "wake", v2: "woke", he: "להעיר / להתעורר" },
            { v1: "build", v2: "built", he: "לבנות" }, { v1: "send", v2: "sent", he: "לשלוח" },
            { v1: "spend", v2: "spent", he: "לבזבז / לבלות" }, { v1: "lend", v2: "lent", he: "להלוות" },
            { v1: "get", v2: "got", he: "לקבל" }, { v1: "forget", v2: "forgot", he: "לשכוח" },
            { v1: "shoot", v2: "shot", he: "לירות" },
            { v1: "leave", v2: "left", he: "לעזוב / להשאיר" }, { v1: "mean", v2: "meant", he: "להתכוון" },
            { v1: "dream", v2: "dreamt", he: "לחלום" }, { v1: "sleep", v2: "slept", he: "לישון" },
            { v1: "keep", v2: "kept", he: "לשמור" }, { v1: "feel", v2: "felt", he: "להרגיש" },
            { v1: "sweep", v2: "swept", he: "לטאטא" },
            { v1: "shut", v2: "shut", he: "לסגור" }, { v1: "put", v2: "put", he: "לשים" },
            { v1: "hit", v2: "hit", he: "להכות" }, { v1: "read", v2: "read", he: "לקרוא" },
            { v1: "cost", v2: "cost", he: "לעלות" }, { v1: "let", v2: "let", he: "לאפשר" },
            { v1: "cut", v2: "cut", he: "לחתוך" }, { v1: "hurt", v2: "hurt", he: "לפגוע" }
        ];

        let currentCategory = '';
        let currentMode = '';
        let score = 0;
        let currentQuestionIndex = 0;
        let shuffledList = [];

        // App Navigation
        function setCategory(cat) {
            currentCategory = cat;
            document.getElementById('category-screen').classList.add('hidden');
            document.getElementById('mode-screen').classList.remove('hidden');
            document.getElementById('header-subtitle').innerText =
                cat === 'vocab' ? 'מתרגלים אוצר מילים' : cat === 'verbs' ? 'מתרגלים פעלים' : 'מתרגלים הכל';
        }

        function resetToCategories() {
            document.getElementById('category-screen').classList.remove('hidden');
            document.getElementById('mode-screen').classList.add('hidden');
            document.getElementById('header-subtitle').innerText = 'מוכנים לתרגל?';
        }

        function startGame(mode) {
            currentMode = mode;
            score = 0;
            currentQuestionIndex = 0;
           
            let pool = [];
            if (currentCategory === 'vocab') {
                pool = originalVocab.map(w => ({ q: w.he, a: w.en, type: 'vocab' }));
            } else if (currentCategory === 'verbs') {
                pool = irregularVerbs.map(v => ({ q: `${v.he} (עבר)`, a: v.v2, v1: v.v1, type: 'verb' }));
            } else {
                pool = [
                    ...originalVocab.map(w => ({ q: w.he, a: w.en, type: 'vocab' })),
                    ...irregularVerbs.map(v => ({ q: `${v.he} (עבר)`, a: v.v2, v1: v.v1, type: 'verb' }))
                ];
            }

            shuffledList = [...pool].sort(() => Math.random() - 0.5);
            document.getElementById('mode-screen').classList.add('hidden');
            document.getElementById('game-container').classList.remove('hidden');
            updateScore();
            loadNextQuestion();
        }

        function backToMenu() {
            document.getElementById('game-container').classList.add('hidden');
            document.getElementById('category-screen').classList.remove('hidden');
        }

        // Logic - Choice Traps
        function generateOptions(current) {
            let options = [current.a];
            if (current.type === 'verb') {
                if (!options.includes(current.v1)) options.push(current.v1); // V1 trap
                let fakeEd = current.v1.endsWith('e') ? current.v1 + 'd' : current.v1 + 'ed';
                if (!options.includes(fakeEd)) options.push(fakeEd); // ED trap
                while (options.length < 4) {
                    let randomV2 = irregularVerbs[Math.floor(Math.random() * irregularVerbs.length)].v2;
                    if (!options.includes(randomV2)) options.push(randomV2);
                }
            } else {
                while(options.length < 4) {
                    let randomEn = originalVocab[Math.floor(Math.random() * originalVocab.length)].en;
                    if(!options.includes(randomEn)) options.push(randomEn);
                }
            }
            return options.sort(() => Math.random() - 0.5);
        }

        function loadNextQuestion() {
            const ui = document.getElementById('game-ui');
            ui.innerHTML = '';

            if (currentQuestionIndex >= 10 && currentMode !== 'match') {
                showSummary();
                return;
            }

            const current = shuffledList[currentQuestionIndex];

            if (currentMode === 'choice') {
                const options = generateOptions(current);
                ui.innerHTML = `
                    <div class="text-center space-y-8 py-4">
                        <div class="text-xs font-bold text-gray-400">שאלה ${currentQuestionIndex + 1} מתוך 10</div>
                        <h3 class="text-5xl font-black text-gray-800">${current.q}</h3>
                        <div class="grid grid-cols-1 gap-3 max-w-sm mx-auto">
                            ${options.map(opt => `
                                <button onclick="checkChoice(this, '${opt}', '${current.a}')"
                                    class="p-5 border-2 border-gray-100 rounded-3xl text-xl font-bold text-indigo-700 bg-white hover:border-indigo-500 transition-all">
                                    ${opt}
                                </button>
                            `).join('')}
                        </div>
                    </div>
                `;
            }
            else if (currentMode === 'typing') {
                ui.innerHTML = `
                    <div class="text-center space-y-8 py-4">
                        <div class="text-xs font-bold text-gray-400">שאלה ${currentQuestionIndex + 1} מתוך 10</div>
                        <h3 class="text-5xl font-black text-gray-800">${current.q}</h3>
                        <div class="max-w-xs mx-auto">
                            <input type="text" id="type-input" autocomplete="off" spellcheck="false"
                                class="w-full p-4 border-b-4 border-indigo-100 text-center text-3xl font-bold focus:border-indigo-500 outline-none transition text-indigo-800"
                                placeholder="..." onkeypress="if(event.key === 'Enter') checkTyping('${current.a}')">
                            <button onclick="checkTyping('${current.a}')"
                                class="mt-8 w-full py-4 bg-indigo-600 text-white rounded-[2rem] font-bold text-lg shadow-lg">בדוק</button>
                        </div>
                    </div>
                `;
                setTimeout(() => document.getElementById('type-input').focus(), 100);
            }
            else if (currentMode === 'match') {
                const subset = shuffledList.slice(0, 6);
                const leftWords = [...subset].sort(() => Math.random() - 0.5);
                const rightWords = [...subset].sort(() => Math.random() - 0.5);
                ui.innerHTML = `
                    <div class="py-4 flex flex-col gap-6">
         <div class="flex justify-between gap-4">
                            <div class="flex-1 space-y-2" id="left-col">
                                ${leftWords.map(w => `<div onclick="selectMatch(this, 'left', '${w.a}')" class="match-item p-4 border-2 border-gray-100 rounded-2xl text-center bg-white shadow-sm font-bold text-gray-700 h-16 flex items-center justify-center">${w.q}</div>`).join('')}
                            </div>
                            <div class="flex-1 space-y-2" id="right-col">
                                ${rightWords.map(w => `<div onclick="selectMatch(this, 'right', '${w.a}')" class="match-item p-4 border-2 border-gray-100 rounded-2xl text-center bg-white shadow-sm font-bold text-indigo-600 h-16 flex items-center justify-center">${w.a}</div>`).join('')}
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        function checkChoice(btn, selected, correct) {
            if (selected === correct) {
                btn.classList.add('bg-green-500', 'text-white', 'border-green-500');
                showToast("נכון מאוד!", true);
                score += 10;
                flashScreenSuccess();
            } else {
                btn.classList.add('bg-red-500', 'text-white', 'border-red-500', 'animate-shake');
                showToast(`טעות. התשובה: ${correct}`, false);
            }
            updateScore();
            currentQuestionIndex++;
            setTimeout(loadNextQuestion, 1200);
        }

        function checkTyping(correct) {
            const input = document.getElementById('type-input');
            const val = input.value.trim().toLowerCase();
            if (val === correct.toLowerCase()) {
                input.classList.add('text-green-600');
                showToast("אלופה!", true);
                score += 10;
                flashScreenSuccess();
            } else {
                input.classList.add('text-red-600', 'animate-shake');
                showToast(`התשובה: ${correct}`, false);
            }
            updateScore();
            currentQuestionIndex++;
            setTimeout(loadNextQuestion, 1500);
        }

        let selLeft = null, selRight = null, roundMatches = 0;
        function selectMatch(el, side, id) {
            if (el.classList.contains('matched')) return;
            if (side === 'left') {
                if (selLeft) selLeft.el.classList.remove('selected');
                selLeft = { el, id };
            } else {
                if (selRight) selRight.el.classList.remove('selected');
                selRight = { el, id };
            }
            el.classList.add('selected');
            if (selLeft && selRight) {
                if (selLeft.id === selRight.id) {
                    selLeft.el.classList.add('matched');
                    selRight.el.classList.add('matched');
                    score += 10; roundMatches++;
                    updateScore();
                    if (roundMatches === 6) {
                        setTimeout(() => {
                            if (currentQuestionIndex + 6 < shuffledList.length) {
                                currentQuestionIndex += 6; roundMatches = 0; loadNextQuestion();
                            } else showSummary();
                        }, 500);
                    }
                } else {
                    const l = selLeft.el, r = selRight.el;
                    l.classList.add('animate-shake'); r.classList.add('animate-shake');
                    setTimeout(() => {
                        l.classList.remove('selected', 'animate-shake');
                        r.classList.remove('selected', 'animate-shake');
                    }, 400);
                }
                selLeft = null; selRight = null;
            }
        }

        // Dictionary Functions
        function toggleDictionary() {
            const dict = document.getElementById('dictionary-screen');
            const isHidden = dict.classList.contains('hidden');
            if (isHidden) {
                dict.classList.remove('hidden');
                filterDictionary('all');
            } else {
                dict.classList.add('hidden');
            }
        }

        function filterDictionary(type) {
            const list = document.getElementById('dictionary-list');
            list.innerHTML = '';
           
            let data = [];
            if (type === 'all' || type === 'vocab') {
                data = data.concat(originalVocab.map(i => ({...i, type: 'מילה'})));
            }
            if (type === 'all' || type === 'verbs') {
                data = data.concat(irregularVerbs.map(i => ({en: `${i.v1} → ${i.v2}`, he: i.he, type: 'פועל'})));
            }

            data.forEach(item => {
                const div = document.createElement('div');
                div.className = "p-4 bg-gray-50 rounded-2xl flex justify-between items-center border border-gray-100";
                div.innerHTML = `
                    <div class="text-right">
                        <div class="text-xs font-bold text-indigo-400 uppercase tracking-tighter">${item.type}</div>
                        <div class="font-bold text-gray-800 text-lg">${item.he}</div>
                    </div>
                    <div class="text-left font-mono font-bold text-indigo-600 text-xl">${item.en}</div>
                `;
                list.appendChild(div);
            });
        }

        // Helpers
        function showToast(text, isSuccess) {
            const t = document.getElementById('feedback-toast');
            t.innerText = text;
            t.className = `fixed top-12 left-1/2 -translate-x-1/2 z-[100] px-8 py-3 rounded-full text-white font-bold shadow-2xl transition-all duration-300 ${isSuccess ? 'bg-green-500' : 'bg-red-500'}`;
            t.style.opacity = "1";
            setTimeout(() => t.style.opacity = "0", 1200);
        }

        function flashScreenSuccess() {
            const app = document.getElementById('app');
            app.classList.add('animate-success');
            setTimeout(() => app.classList.remove('animate-success'), 400);
        }

        function updateScore() {
            document.getElementById('current-score').innerText = score;
        }

        function showSummary() {
            const ui = document.getElementById('game-ui');
            ui.innerHTML = `
                <div class="text-center space-y-8 py-8 animate-fade-in">
                    <div class="text-7xl">🏆</div>
                    <h2 class="text-4xl font-black text-indigo-700">סיימת!</h2>
                    <p class="text-xl text-gray-500 italic">הגעת לניקוד של:</p>
                    <div class="text-7xl font-black text-indigo-600 bg-indigo-50 px-12 py-6 rounded-[3rem] inline-block shadow-inner">${score}</div>
                    <div class="pt-8">
                        <button onclick="backToMenu()" class="px-12 py-5 bg-indigo-600 text-white rounded-full font-bold text-xl shadow-xl hover:scale-105 transition active:scale-95">שחק שוב</button>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
